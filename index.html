<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>荒唐無稽仮説発射台</title>
    <link rel="stylesheet" href="./styles.css?v=20260816-mobile-tight-viewport" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="start-screen" id="startScreen" aria-labelledby="startTitle">
        <div class="start-panel">
          <h1 class="start-title" id="startTitle">荒唐無稽仮説発射台</h1>
          <p class="start-kicker">仮説を立てたいテーマを入力してください。</p>
          <form class="theme-form" id="themeForm">
            <input
              id="themeInput"
              class="theme-input"
              type="text"
              inputmode="text"
              autocomplete="off"
              aria-label="仮説を立てたいテーマ"
            />
            <button class="primary-button" type="submit">次へ</button>
          </form>
        </div>
      </section>

      <section class="workspace is-hidden" id="workspace" aria-label="仮説マトリクス">
        <header class="topbar">
          <button class="ghost-button compact" id="backButton" type="button">テーマ</button>
          <div class="brand">
            <span class="brand-sub" id="themeLabel">新しい○○の開発</span>
          </div>
          <div class="axis-actions" aria-label="軸の変更">
            <button class="ghost-button compact" id="undoAxisButton" type="button" disabled>
              軸を戻す
            </button>
            <button class="ghost-button compact" id="shuffleHorizontalButton" type="button">
              ヨコ軸を変える
            </button>
            <button class="ghost-button compact" id="shuffleVerticalButton" type="button">
              タテ軸を変える
            </button>
          </div>
          <button class="ghost-button compact" id="listMode" type="button">リスト</button>
        </header>

        <section class="board-view" id="boardView" aria-label="仮説マトリクス">
          <div class="axis-label axis-top" id="axisTop"></div>
          <div class="axis-label axis-bottom" id="axisBottom"></div>
          <div class="axis-label axis-left" id="axisLeft"></div>
          <div class="axis-label axis-right" id="axisRight"></div>
          <button class="axis-center-button" id="shuffleBothButton" type="button">軸変</button>

          <div class="matrix" id="matrix">
            <article class="cell" data-cell="0">
              <div class="hypothesis-pill"></div>
              <div class="idea-row">
                <input class="idea-input" type="text" aria-label="左上のアイデア" />
                <button class="save-button" type="button">保存</button>
              </div>
            </article>
            <article class="cell" data-cell="1">
              <div class="hypothesis-pill"></div>
              <div class="idea-row">
                <input class="idea-input" type="text" aria-label="右上のアイデア" />
                <button class="save-button" type="button">保存</button>
              </div>
            </article>
            <article class="cell" data-cell="2">
              <div class="hypothesis-pill"></div>
              <div class="idea-row">
                <input class="idea-input" type="text" aria-label="左下のアイデア" />
                <button class="save-button" type="button">保存</button>
              </div>
            </article>
            <article class="cell" data-cell="3">
              <div class="hypothesis-pill"></div>
              <div class="idea-row">
                <input class="idea-input" type="text" aria-label="右下のアイデア" />
                <button class="save-button" type="button">保存</button>
              </div>
            </article>
          </div>
        </section>

        <section class="list-view is-hidden" id="listView" aria-label="保存したアイデア">
          <div class="list-header">
            <h1>保存したアイデア</h1>
            <div class="list-actions">
              <button class="ghost-button" id="copyButton" type="button">コピー</button>
              <button class="ghost-button" id="clearButton" type="button">全消去</button>
            </div>
          </div>
          <ol class="idea-list" id="ideaList"></ol>
          <p class="empty-message" id="emptyMessage">まだ保存されたアイデアはありません。</p>
        </section>
      </section>

      <dialog class="jump-dialog" id="jumpDialog">
        <form method="dialog" class="jump-card" id="jumpForm">
          <p class="jump-source" id="jumpSource"></p>
          <h2 id="jumpPrompt"></h2>
          <input
            id="jumpInput"
            class="jump-input"
            type="text"
            autocomplete="off"
            aria-label="深めたアイデア"
          />
          <div class="dialog-actions">
            <button class="ghost-button" value="cancel" type="submit">キャンセル</button>
            <button class="primary-button small" id="jumpOk" value="ok" type="submit">OK</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="./app.js?v=20260816-mobile-tight-viewport"></script>
  </body>
</html>
